---
- name: Check if {{ cluster_name }} is management cluster
  shell: >-
    kubectl --kubeconfig /tmp/{{ cluster_name }}.kubeconfig get pods -A | grep -c capo-system
  register: capo_system_pods
  become: true
  ignore_errors: true

- name: Install Openstack Resource Controller (ORC) CRD's
  shell: >-
    kubectl --kubeconfig /tmp/{{ cluster_name }}.kubeconfig apply \
    -f https://github.com/k-orc/openstack-resource-controller/releases/download/{{ orc_version }}/install.yaml
  become: true
  when:
    - capo_system_pods.stdout != "1"

- name: Install Openstack management for {{ cluster_name }} (Plain)
  shell: >-
    clusterctl --kubeconfig /tmp/{{ cluster_name }}.kubeconfig init --infrastructure {{ clusterctl_provider }}:{{ clusterctl_provider_version }}
  become: true
  when:
    - capo_system_pods.stdout != "1"
    - capi_deployment != "talos"

- name: Install Openstack management for {{ cluster_name }} (Talos)
  shell: >-
    clusterctl --kubeconfig /tmp/{{ cluster_name }}.kubeconfig init -c talos -b talos --infrastructure {{ clusterctl_provider }}:{{ clusterctl_provider_version }}
  become: true
  when:
    - capo_system_pods.stdout != "1"
    - capi_deployment == "talos"

- name: Wait 2 minutes for Openstack management to settle
  pause:
    seconds: 120
  when:
    - capo_system_pods.stdout != "1"

- name: Management | Write {{ cluster_name }}.kubeconfig to localhost
  delegate_to: localhost
  ansible.builtin.copy:
    content: "{{kubeconfig_output.stdout}}"
    dest: "confg-{{ cluster_name }}"
  when:
    - capo_system_pods.stdout != "1"